name: Render & Deploy Kindle Weather Widget

on:
  push:
    branches:
      - main
  schedule:
    # Fallback schedule (37 minutes past the hour); primary trigger is workflow_dispatch.
    - cron: '37 * * * *'
  workflow_dispatch:

concurrency:
  group: weather-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Puppeteer browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: Install dependencies and Chromium for Puppeteer
        run: |
          npm install --no-package-lock --registry=https://registry.npmjs.org/
          npx puppeteer browsers install chrome

      - name: Render weather images (0°, 90°, 180°, 270°)
        run: node render.js

      - name: Prepare publish directory
        run: |
          mkdir -p dist
          cp weather.png weather-90.png weather-180.png weather-270.png dist/

      - name: Deploy weather images to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'chore: update weather images'
